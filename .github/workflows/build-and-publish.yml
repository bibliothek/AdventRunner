name: Build and Publish

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v2
      - name: Login to Docker Hub
        run: docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
        if: github.ref == 'refs/heads/master'
        env:
          DOCKER_USERNAME: ${{secrets.DOCKER_USERNAME}}
          DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag mthaller/adventrunner:${{ github.sha }}
      - name: Publish image
        run: |
          docker push mthaller/adventrunner:${{ github.sha }}
        if: github.ref == 'refs/heads/master'

  # Bumps the adventrunner tag in matha-web's images.yml; its update.sh cron then
  # rolls it out. Only for master, so other runs just build/publish.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Queue bumps so an older build can't land after a newer one.
    concurrency: matha-web-bump

    steps:
      - uses: actions/checkout@v4
        with:
          repository: bibliothek/matha-web
          token: ${{ secrets.MATHA_WEB_TOKEN }}

      - name: Bump adventrunner tag in images.yml
        env:
          SHA: ${{ github.sha }}
        run: |
          sed -i -E "s#^(\s*image: .*/adventrunner:).*#\1${SHA}#" images.yml
          if git diff --quiet; then
            echo "images.yml already at ${SHA}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy adventrunner ${SHA::7}" \
            -m "From ${{ github.server_url }}/${{ github.repository }}/commit/${SHA}"
          # Other apps' pipelines push the same file; rebase and retry on a race.
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 2))
            git pull --rebase
          done
          exit 1
